include required(classpath("application"))

# Cromwell's GCP Batch backend runs every non-user step (container setup, localization,
# delocalization, stdout/stderr upload) in a Cloud SDK image hardcoded as
# gcr.io/google.com/cloudsdktool/cloud-sdk:461.0.0-alpine (RunnableUtils.CloudSdkImage).
# Google applied a one-year retention policy to those repos on 2026-08-26 and deleted that tag,
# so every Batch task failed at its first runnable with no stderr or rc reaching GCS, and
# Cromwell reported only "Initializing -> Failed / The job was stopped before the command
# finished". See broadinstitute/cromwell#7899 and #7900.
#
# Must be a Debian-based variant: the Batch backend injects CLOUDSDK_PYTHON=/usr/bin/python3 into
# every runnable, and the alpine images ship Python at /usr/local/bin/python3 only, so gsutil
# would fail with 127 during localization instead.
#
# This tag expires around 2027-09. When it does, tests will fail the same way; replace it with a
# current *-slim tag from https://gcr.io/v2/google.com/cloudsdktool/google-cloud-cli/tags/list
# (or use the floating "slim" tag to avoid the yearly bump).
google {
  cloud-sdk-image-url = "gcr.io/google.com/cloudsdktool/google-cloud-cli:583.0.0-slim"
}

engine {
  filesystems {
    gcs {
      auth = "application-default"
      }
  }
}

backend.providers.Local.config.filesystems {
	gcs {
		auth = "application-default"
	}
}

backend {
  default = GCPBATCH

  providers {
    GCPBATCH {
      actor-factory = "cromwell.backend.google.batch.GcpBatchBackendLifecycleActorFactory"
      config {
        project = "broad-dsde-methods"

        root = "gs://palantir-workflows-test-execution"

        maximum-polling-interval = 600

        batch {
          auth = "application-default"

          location = "us-central1"

          parallel-composite-upload-threshold="150M"
        }

        filesystems {
          gcs {
            auth = "application-default"
            project = "broad-dsde-methods"

            caching {
              # When a cache hit is found, the following duplication strategy will be followed to use the cached outputs
              # Possible values: "copy", "reference". Defaults to "copy"
              # "copy": Copy the output files
              # "reference": DO NOT copy the output files but point to the original output files instead.
              #              Will still make sure than all the original output files exist and are accessible before
              #              going forward with the cache hit.
              duplication-strategy = "copy"
            }
          }
        }

        default-runtime-attributes {
          cpu: 1
          failOnStderr: false
          continueOnReturnCode: 0
          memory: "2048 MB"
          bootDiskSizeGb: 10
          # Allowed to be a String, or a list of Strings
          disks: "local-disk 10 SSD"
          noAddress: false
          preemptible: 0
          zones: ["us-central1-a", "us-central1-b"]
        }

      }
    }
  }
}
